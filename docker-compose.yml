services:
  postgres:
    image: postgres:16-alpine
    container_name: newsroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: newsroom
      POSTGRES_DB: newsroom
    ports:
      - "5432:5432"
    volumes:
      - newsroom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom -d newsroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local Ollama. Postgres does not depend on this service.
  # Prefer host Ollama instead: leave this commented and set OLLAMA_HOST=http://localhost:11434
  ollama:
    image: ollama/ollama:latest
    container_name: newsroom-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - newsroom_ollama_data:/root/.ollama

volumes:
  newsroom_pg_data:
  newsroom_ollama_data:
