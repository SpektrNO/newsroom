services:
  postgres:
    image: postgres:16-alpine
    container_name: newsroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsroom}
      POSTGRES_DB: newsroom
    # Loopback by default — not LAN/internet-reachable. Override only when you
    # intentionally expose the host (firewall + rotate POSTGRES_PASSWORD first):
    #   COMPOSE_HOST_BIND=0.0.0.0 docker compose up -d
    # See docs/ops-local.md#compose-network-binding
    ports:
      - "${COMPOSE_HOST_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - newsroom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom -d newsroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Default local Ollama (same `docker compose up -d` as Postgres). CPU-only.
  # For GPU passthrough, layer docker-compose.gpu.yml on top — see
  # docs/ops-local.md#gpu-with-docker-compose (requires NVIDIA Container
  # Toolkit on the host first).
  # Postgres-only: docker compose up -d postgres
  ollama:
    image: ollama/ollama:latest
    container_name: newsroom-ollama
    restart: unless-stopped
    ports:
      - "${COMPOSE_HOST_BIND:-127.0.0.1}:11434:11434"
    volumes:
      - newsroom_ollama_data:/root/.ollama

volumes:
  newsroom_pg_data:
  newsroom_ollama_data:
